<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --sf-blue: #00A1E0;
        }
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-graphic {
            width: 380px;
            height: 380px;
            position: relative;
        }

        .hero-cloud {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cloud-icon {
            position: relative;
            z-index: 2;
        }

        .orbit-ring {
            position: absolute;
            border: 1px solid rgba(0,161,224,0.2);
            border-radius: 50%;
            animation: spin 25s linear infinite;
        }

        .orbit-ring:nth-child(1) {
            width: 280px;
            height: 280px;
            top: 50px;
            left: 50px;
        }

        .orbit-ring:nth-child(2) {
            width: 360px;
            height: 360px;
            top: 10px;
            left: 10px;
            animation-direction: reverse;
            animation-duration: 35s;
        }

        .orbit-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--sf-blue);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0,161,224,0.5);
        }

        .orbit-ring:nth-child(1) .orbit-dot { top: -5px; left: 50%; }
        .orbit-ring:nth-child(2) .orbit-dot { bottom: -5px; right: 30%; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="hero-visual">
                <div class="hero-graphic">
                    <div class="orbit-ring">
                        <div class="orbit-dot"></div>
                    </div>
                    <div class="orbit-ring">
                        <div class="orbit-dot"></div>
                    </div>
                    <div class="hero-cloud">
                        <svg class="cloud-icon" width="140" height="140" viewBox="0 0 140 140" fill="none">
                            <path d="M70 20C50 20 34 34 30 52C14 54 2 68 2 84C2 102 16 116 34 116H106C122 116 136 102 136 86C136 70 124 58 108 56C106 36 90 20 70 20Z" fill="rgba(0,161,224,0.15)" stroke="rgba(0,161,224,0.4)" stroke-width="2"/>
                            <text x="70" y="78" text-anchor="middle" fill="rgba(0,161,224,0.8)" font-size="24" font-weight="800" font-family="Inter, sans-serif">SF</text>
                        </svg>
                    </div>
                </div>
            </div>
</body>
</html>
